<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="makoEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#02040a" stroke="url(#makoEnergy)" stroke-width="4" filter="url(#neonGlow)" />
  
  <polygon points="50,15 80,32.5 50,85 20,32.5" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.3" />

  <path d="M 65,30 L 65,65 L 45,80 L 30,65 L 30,55" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" filter="url(#neonGlow)" />
  
  <polygon points="30,37 35,42 30,47 25,42" fill="#00ffff" filter="url(#neonGlow)" />
</svg>
